<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Dashboard Project</title>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <button class="sidebar-toggle-btn">▶</button>
        <div class="sidebar-content">
          <!-- Здесь позже будут: 
                     - выбор месяца
                     - выбор года
                     - навигация (Проекты/Сотрудники)
                     - Seed Data кнопка
                -->
          <div class="nav-tabs">
            <button class="nav-tab active" data-tab="projects">Projects</button>
            <button class="nav-tab" data-tab="employees">Employees</button>
          </div>
        </div>
      </aside>
      <button class="menu-button">☰ Control panel</button>
      <main class="main">
        <div class="table-container" id="projects-table-container">
          <div class="table-header">
            <h1>Projects</h1>
            <button class="add-btn" id="add-project-btn">+ Add Project</button>
          </div>
          <table class="projects-table">
            <thead>
              <tr>
                <th>Company Name</th>
                <th>Project Name</th>
                <th>Budget</th>
                <th>Employee Capacity</th>
                <th>Employees</th>
                <th>Estimated Income</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="7">Нет данных</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="table-container hidden" id="employees-table-container">
          <div class="table-header">
            <h1>Employees</h1>
            <button class="add-btn" id="add-employee-btn">+ Add Employee</button>
          </div>
          <table class="employees-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Surname</th>
                <th>Age</th>
                <th>Position</th>
                <th>Salary</th>
                <th>Estimated Payment</th>
                <th>Project</th>
                <th>Projected Income</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="9">Нет данных</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
    <div class="modal-overlay" id="project-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add New Project</h2>
          <button class="modal-close-btn" id="close-project-modal">×</button>
        </div>
        <form id="project-form">
          <div class="form-group">
            <label for="projectName">Project Name *</label>
            <input type="text" id="projectName" required />
            <div class="error-message" id="projectName-error"></div>
          </div>
          <div class="form-group">
            <label for="companyName">Company Name *</label>
            <input type="text" id="companyName" required />
            <div class="error-message" id="companyName-error"></div>
          </div>
          <div class="form-group">
            <label for="budget">Budget (€) *</label>
            <input type="number" id="budget" step="0.01" required />
            <div class="error-message" id="budget-error"></div>
          </div>
          <div class="form-group">
            <label for="employeeCapacity">Employee Capacity *</label>
            <input type="number" id="employeeCapacity" step="1" min="1" required />
            <div class="error-message" id="capacity-error"></div>
          </div>
          <div class="form-buttons">
            <button type="button" class="cancel-btn" id="cancel-project-btn">Cancel</button>
            <button type="submit" class="submit-btn" id="submit-project-btn" disabled>Add Project</button>
          </div>
        </form>
      </div>
    </div>
    <div class="modal-overlay" id="employee-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add New Employee</h2>
          <button class="modal-close-btn" id="close-employee-modal">×</button>
        </div>

        <form id="employee-form">
          <div class="form-group">
            <label for="employeeName">Name *</label>
            <input type="text" id="employeeName" required />
            <div class="error-message" id="employeeName-error"></div>
          </div>

          <div class="form-group">
            <label for="employeeSurname">Surname *</label>
            <input type="text" id="employeeSurname" required />
            <div class="error-message" id="employeeSurname-error"></div>
          </div>

          <div class="form-group">
            <label for="birthDate">Date of Birth *</label>
            <input type="date" id="birthDate" required />
            <div class="error-message" id="birthDate-error"></div>
          </div>

          <div class="form-group">
            <label for="position">Position *</label>
            <select id="position" required>
              <option value="">Select position</option>
              <option value="Junior">Junior</option>
              <option value="Middle">Middle</option>
              <option value="Senior">Senior</option>
              <option value="Lead">Lead</option>
              <option value="Architect">Architect</option>
              <option value="BO">BO</option>
            </select>
            <div class="error-message" id="position-error"></div>
          </div>

          <div class="form-group">
            <label for="employeeSalary">Salary (€) *</label>
            <input type="number" id="employeeSalary" step="100" required />
            <div class="error-message" id="employeeSalary-error"></div>
          </div>

          <div class="form-buttons">
            <button type="button" class="cancel-btn" id="cancel-employee-btn">Cancel</button>
            <button type="submit" class="submit-btn" id="submit-employee-btn" disabled>Add Employee</button>
          </div>
        </form>
      </div>
    </div>
    <script src="./js/data.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/addProject.js"></script>
    <script src="./js/addEmployee.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
